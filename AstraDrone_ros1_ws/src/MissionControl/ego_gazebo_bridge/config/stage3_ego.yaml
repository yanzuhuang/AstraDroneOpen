# Bridge envelope for stage3. Control remains disabled by default.
enable_control: false
require_sim_time: true
auto_track_on_command: false
takeoff_height: 4.0
return_height: 4.0
min_relative_height: 0.3
max_relative_height: 40.0
max_horizontal_radius: 60.0
cloud_timeout: 0.7
planner_odom_timeout: 0.7
command_timeout: 0.60
land_after_loss: 8.0
# Long 38 m crane-clearance egress measured 0.649 m maximum and 0.343 m P95
# FAST-LIO-to-MAVROS tracking offset. Keep a bounded stage3-only margin below
# the independent 1.0 m sustained trajectory tracking protection and the
# task's 2.0 m hard endpoint clearance.
alignment_position_tolerance: 0.75
alignment_yaw_error_duration: 1.0
virtual_ceil_height: 45.0
planning_frame: camera_init
mavros_frame: map
command_topic: /planning/pos_cmd
planner_odom_topic: /Odometry
cloud_topic: /stage3/cloud_registered_filtered
input_goal_topic: /move_base_simple/goal
planner_goal_topic: /planning/goal
setpoint_topic: /mavros/setpoint_raw/local
planning_cancel_topic: /planning/cancel

# Match the Stage 2 verified yaw boundary: approach is velocity-forward;
# final observation alignment, climb, sector and recovery explicitly face the tower.
tower_yaw_override_enabled: true
tower_camera_yaw_offset: 0.0
forward_yaw_min_speed: 0.05
tower_center_topic: /tower_mission/selected_tower_center
tower_yaw_mode_topic: /tower_mission/face_tower
max_yaw_rate: 0.5235987755982988
