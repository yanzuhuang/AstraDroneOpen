enable_control: false
require_sim_time: true
auto_track_on_command: true

publish_rate: 50.0
prestream_duration: 3.0
request_interval: 2.0
takeoff_height: 4.0
return_height: 4.0
takeoff_tolerance: 0.25
hover_duration: 2.0

min_relative_height: 0.3
max_relative_height: 32.0
max_horizontal_radius: 60.0

command_timeout: 0.60
# Separate ROS processes can observe adjacent /clock samples; accept only the
# measured 1 ms skew with a conservative 20 ms upper bound.
timestamp_future_tolerance: 0.02
goal_timeout: 2.0
fcu_state_timeout: 1.0
extended_state_timeout: 1.0
mavros_pose_timeout: 0.30
planner_odom_timeout: 0.30
cloud_timeout: 0.80
land_after_loss: 5.0
wait_fcu_timeout: 60.0
wait_inputs_timeout: 120.0
arm_offboard_timeout: 30.0
takeoff_timeout: 90.0
landing_timeout: 120.0

# Position slew is used only by takeoff/HOLD. EGO tracking publishes the
# complete time-consistent raw target without position chasing.
max_position_rate: 0.50
# 与阶段1最终验收的30 deg/s偏航速率上限一致。
max_yaw_rate: 0.5235987755982988
max_velocity: 0.35
max_acceleration: 0.60
gravity_alignment_tolerance: 0.017453292519943295
tracking_error_limit: 1.0
tracking_error_duration: 1.0

alignment_position_tolerance: 0.25
alignment_yaw_tolerance: 0.3490658504
return_tolerance: 0.40
return_hold_duration: 2.0

# 进场/返航按PositionCommand水平速度直接计算机头前向；圆周段朝最近塔中心。
# 低于该水平速度时方向无定义，保持上一航向，避免临停点附近抖动。
tower_yaw_override_enabled: true
tower_camera_yaw_offset: 0.0
forward_yaw_min_speed: 0.05
tower_center_topic: /tower_mission/selected_tower_center
tower_yaw_mode_topic: /tower_mission/face_tower

planning_frame: camera_init
mavros_frame: map
command_topic: /planning/pos_cmd
planner_odom_topic: /Odometry
cloud_topic: /cloud_registered
mavros_state_topic: /mavros/state
mavros_extended_state_topic: /mavros/extended_state
mavros_pose_topic: /mavros/local_position/pose
setpoint_topic: /mavros/setpoint_raw/local
control_topics:
  position:
    - /mavros/setpoint_position/local
    - /mavros/setpoint_position/global
    - /mavros/setpoint_position/global_to_local
  raw_local:
    - /mavros/setpoint_raw/local
  velocity:
    - /mavros/setpoint_velocity/cmd_vel
    - /mavros/setpoint_velocity/cmd_vel_unstamped
  attitude:
    - /mavros/setpoint_attitude/attitude
    - /mavros/setpoint_attitude/cmd_vel
    - /mavros/setpoint_raw/attitude
  thrust:
    - /mavros/setpoint_attitude/thrust
arming_service: /mavros/cmd/arming
set_mode_service: /mavros/set_mode
input_goal_topic: /move_base_simple/goal
planner_goal_topic: /planning/goal
