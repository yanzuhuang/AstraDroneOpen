# Reusable EGO-to-MAVROS bridge defaults; this file is not tied to a roadmap stage.
# Control remains disabled until the complete dry-run checklist passes.
enable_control: false
require_sim_time: true
auto_track_on_command: false

# OFFBOARD contract. PX4 requires a continuous setpoint stream faster than 2 Hz;
# 50 Hz leaves enough margin for a Gazebo-only engineering exercise.
publish_rate: 50.0
prestream_duration: 2.0
request_interval: 2.0

# Conservative indoor flight envelope, expressed relative to the captured home.
takeoff_height: 1.0
# Defaults to takeoff_height when omitted; set separately only when the planner
# uses a different collision-aware return altitude.
return_height: 1.0
takeoff_tolerance: 0.15
hover_duration: 1.0
min_relative_height: 0.3
max_relative_height: 2.0
max_horizontal_radius: 10.0

# Input watchdogs. A short command loss first enters HOLD, then AUTO.LAND.
command_timeout: 0.2
timestamp_future_tolerance: 0.02
goal_timeout: 2.0
fcu_state_timeout: 1.0
extended_state_timeout: 1.0
mavros_pose_timeout: 0.2
planner_odom_timeout: 0.2
cloud_timeout: 0.5
land_after_loss: 3.0
wait_fcu_timeout: 60.0
wait_inputs_timeout: 120.0
arm_offboard_timeout: 30.0
takeoff_timeout: 60.0
landing_timeout: 90.0

# Setpoint slew-rate limiting prevents a discontinuous EGO command from
# becoming an equally discontinuous MAVROS target. The node converts these
# rates to a per-cycle step using publish_rate.
max_position_rate: 0.5
max_yaw_rate: 0.75
max_velocity: 0.5
max_acceleration: 1.0
gravity_alignment_tolerance: 0.017453292519943295  # 1 degree
tracking_error_limit: 1.0
tracking_error_duration: 1.0

# FAST-LIO odometry and MAVROS local pose must describe the same vehicle pose.
alignment_position_tolerance: 0.25
alignment_yaw_tolerance: 0.2617993878  # 15 degrees
alignment_yaw_error_duration: 1.0

return_tolerance: 0.25
return_hold_duration: 1.0

planning_frame: camera_init
mavros_frame: map

command_topic: /planning/pos_cmd
planner_odom_topic: /Odometry
cloud_topic: /cloud_registered
mavros_state_topic: /mavros/state
mavros_extended_state_topic: /mavros/extended_state
mavros_pose_topic: /mavros/local_position/pose
setpoint_topic: /mavros/setpoint_raw/local
# All standard MAVROS command paths are authority gates. The bridge only
# publishes only raw-local setpoint_topic; every category remains monitored.
control_topics:
  position:
    - /mavros/setpoint_position/local
    - /mavros/setpoint_position/global
    - /mavros/setpoint_position/global_to_local
  raw_local:
    - /mavros/setpoint_raw/local
  velocity:
    - /mavros/setpoint_velocity/cmd_vel
    - /mavros/setpoint_velocity/cmd_vel_unstamped
  attitude:
    - /mavros/setpoint_attitude/attitude
    - /mavros/setpoint_attitude/cmd_vel
    - /mavros/setpoint_raw/attitude
  thrust:
    - /mavros/setpoint_attitude/thrust
arming_service: /mavros/cmd/arming
set_mode_service: /mavros/set_mode
input_goal_topic: /move_base_simple/goal
planner_goal_topic: /planning/goal
