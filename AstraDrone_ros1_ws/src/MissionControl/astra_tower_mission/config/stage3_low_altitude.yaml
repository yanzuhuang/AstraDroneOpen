# Parameterized two-layer low-altitude inspection profile for worksite.world.
# Per-vehicle launch parameters override the default 7 -> 3 m layer pair.
enable_control: false
planning_frame: camera_init

tower:
  name: radio_tower
  frame_id: map
  center: {x: -10.0551, y: 19.7104}
  collision_radius: 6.41

mission:
  inspection_top_height: &inspection_height 7.0
  layer_offsets: [0.0, -4.0]
  recovery_height_max: 17.0
  virtual_ceil_height: 18.0
  # Preserve the existing inspection ring and fixed map waypoint angles.
  radius: 12.5
  sector_count: 8
  sector_limit: 8
  inspection_laps: 1
  planned_cycles: 1
  start_angle_deg: 0.0
  inspection_start_sector: 3
  transition_sector: 3
  direction: counter_clockwise
  minimum_height: 2.0
  maximum_height: 18.0
  minimum_safety_distance: 2.0
  transit_height: 7.0
  observation_radius_offset: 5.0
  observation_angle_deg: -67.5
  approach_segment_length: 5.0
  # Use the full configured 45-degree sector for bounded target relocation.
  # This does not skip a sector or change direction/radius preference.
  sector_angle_half_width_deg: 22.0
  sector_radius_half_width: 4.0
  sector_height_half_width: 1.0
  maximum_temporary_descent: 1.0
  target_replacement_margin: 2.0

low_altitude:
  enabled: true
  entry_height: 7.0
  # /grid_map/occupancy_inflate is already a 3-D vehicle-envelope map. Sample
  # the requested flight plane with one voxel of vertical tolerance; projecting
  # the old +/-2.8 m column onto the flight layer duplicated vertical
  # inflation and made
  # overhead tree canopy look like a horizontal collision.
  vertical_half_extent: 0.2
  # /grid_map/occupancy_inflate already contains EGO's 0.4 m hard vehicle
  # envelope. Task-side reachability diagnostics add 0.5 m without charging
  # the vehicle radius twice; EGO's optimizer uses its separate dist0 below.
  # At 0.2 m resolution the hard envelope remains a two-cell dilation.
  additional_clearance: 0.5
  grid_resolution: 0.2
  boundary_margin: 8.0
  # Retained only for offline reachability diagnostics. It is never used to
  # split ENTRY_GATE or numbered waypoints into EGO mission goals.
  maximum_segment_length: 5.0
  altitude_tolerance: 0.35
  # Vertical escape requires distinct fresh-map no-path confirmations.
  no_path_confirmations: 3
  no_path_confirmation_period: 1.0
  maximum_ingress_replans: 12
  # Safe cells are ranked by these generic live-map costs. Occupancy and the
  # tower keep-out remain hard constraints independent of the weights.
  path_score:
    path_length_weight: 1.0
    goal_deviation_weight: 0.03
    tower_distance_weight: 0.08
    turn_weight: 0.35
    clearance_weight: 0.05

entry_gate:
  # Existing map convention: 1=+X, 2=NE, 3=+Y, 4=NW, 5=-X, 6=SW,
  # 7=-Y, 8=SE. Keep the gate on the unchanged 15 m safety radius.
  entry_sector: 8
  preferred_radius: 15.0
  minimum_radius: 15.0
  maximum_radius: 15.0
  angular_sample_step_deg: 7.5
  radial_sample_step: 1.0
  maximum_horizontal_distance: 60.0
  # Keep the existing 1.0 m task endpoint criterion. The low-altitude EGO map
  # independently uses a 0.4 m hard vehicle envelope; the validated
  # high-altitude candidate clearance remains unchanged in stage3_ego.yaml.
  minimum_clearance: 1.0
  cloud_inflation: 0.4
  # The subscribed map is already EGO-inflated. Use only the same 0.5 m
  # operational margin for map points; cloud_inflation remains available for
  # a raw-cloud fallback and for non-map coarse geometry.
  map_points_are_inflated: true
  map_additional_clearance: 0.5
  unknown_is_hard_constraint: false
  corridor_sample_step: 0.4
  clearance_weight: 0.2
  distance_weight: 0.1
  sector_center_weight: 4.0
  preferred_radius_weight: 4.0
  first_waypoint_weight: 0.8
  blocked_corridor_penalty: 8.0
  maximum_segment_length: 5.0
  prefer_safe_overflight: false
  target_timeout: 120.0
  maximum_relocations: 3

staging:
  use_configured_xy: false
  x: 0.0
  y: 0.0
  # The bridge owns the vertical takeoff and stable entry-layer hover. This
  # bookkeeping height keeps the generic Stage 3 ascent envelope valid; the
  # runtime staging target is max(current_z, 2.5), so it never descends.
  height: 2.5
  climb_height_step: 0.5
  ascent_intermediate_heights: []
  maximum_channel_switches: 0
  minimum_channel_hold: 3.0

layer_transition:
  maximum_vertical_step: 1.0
  same_xy_tolerance: 0.25
  target_timeout: 60.0

coverage:
  angular_bin_deg: 2.0
  neighborhood_radius: 3.0
  sample_resolution: 1.0
  minimum_range: 0.5
  maximum_range: 40.0
  unknown_ratio_limit: 0.75
  wait_timeout: 12.0
  safe_altitude_dwell: 3.0
  sensor_min_elevation_deg: -7.2
  sensor_max_elevation_deg: 52.2

candidate:
  # Reuse the validated high-altitude/swarm same-sector selection rule. The
  # nominal point is preferred while it is clear; an occupied/unreachable
  # endpoint may move only inside the configured angular/radial sector.
  # Height remains fixed at the active layer and no path-intermediate goals
  # are generated.
  angle_offsets_deg: [0.0, -5.0, 5.0, -10.0, 10.0, -15.0, 15.0, -20.0, 20.0]
  radius_offsets_m: [0.0, 2.0, 4.0]
  height_offsets_m: [0.0]
  minimum_clearance: 1.0
  cloud_inflation: 0.4
  map_points_are_inflated: true
  map_additional_clearance: 0.5
  corridor_sample_step: 0.4
  blocked_corridor_penalty: 6.0
  score_clearance_weight: 0.2
  score_radius_weight: 6.0
  score_sector_weight: 4.0
  score_height_weight: 14.0
  score_distance_weight: 0.1
  score_continuity_weight: 0.2
  known_obstacle_is_hard_constraint: true
  known_obstacle_corridor_is_hard_constraint: true
  unknown_is_hard_constraint: false

recovery:
  radial_step: 2.0
  tangent_step: 2.5
  maximum_radius: 16.5
  recovery_height: 5.0
  direction: counter_clockwise

fsm:
  manual_target_height: *inspection_height

# Low-altitude-only EGO overrides. The high-altitude Stage 3 launch keeps the
# vendor defaults. A wider live local update volume lets EGO see the complete
# cylinder passage before committing to an exterior detour.
grid_map:
  local_update_range_x: 10.0
  local_update_range_y: 10.0
  local_update_range_z: 4.5
  max_ray_length: 10.0

# Preserve the validated EGO safety envelope while making every effective
# clearance term explicit for this mode: 0.4 m occupancy inflation plus
# 0.6 m optimizer clearance. The task consumes the already-inflated map
# and never adds the vehicle radius twice.
optimization:
  lambda_smooth: 1.0
  lambda_collision: 2
  lambda_feasibility: 0.1
  # Keep the optimized B-spline close to the live-map A* guide around dense
  # tree/cylinder passages; EGO itself reports increasing this term when the
  # refined trajectory repeatedly leaves a collision-free guide path.
  lambda_fitness: 2.0
  dist0: 0.8

topics:
  odom: /Odometry
  command: /planning/pos_cmd
  cloud: /stage3_low/cloud_registered_filtered
  occupancy_inflate: /stage3_low/occupancy_inflate
  planner_status: /planner/status
  bridge_state: /ego_mavros_bridge/state
  mavros_state: /mavros/state
  mavros_extended_state: /mavros/extended_state
  goal: /move_base_simple/goal

outputs:
  state: /tower_mission/state
  current_target: /tower_mission/current_target
  current_sector: /tower_mission/current_sector
  candidate_targets: /tower_mission/candidate_targets
  progress: /tower_mission/progress
  face_tower: /tower_mission/face_tower
  selected_tower_center: /tower_mission/selected_tower_center
  level_ingress_path: /tower_mission/level_ingress_path
  level_orbit_path: /tower_mission/level_orbit_path
  mission_route: /tower_mission/mission_route
  altitude_policy: /tower_mission/altitude_policy

services:
  tracking: /ego_mavros_bridge/enable_tracking
  cancel: /ego_mavros_bridge/cancel_current_trajectory
  resume: /ego_mavros_bridge/resume_ego
  return_home: /ego_mavros_bridge/return_home
  land: /ego_mavros_bridge/land

input_timeout: 0.7
entry_fcu_state_timeout: 2.0
map_timeout: 0.7
planning_timeout: 10.0
goal_timeout: 120.0
return_timeout: 300.0
landing_timeout: 90.0
return_egress:
  orbit_radius: 16.0
  transit_height: 6.0
  maximum_angle_step_deg: 30.0
  obstacle_inflation: 2.0
  corridor_sample_step: 0.4
  minimum_goal_separation: 0.5
  target_timeout: 90.0
  maximum_retries: 3
  home_xy_tolerance: 1.5
arrival_tolerance: 0.5
arrival_velocity_threshold: 0.2
arrival_yaw_tolerance: 0.26
arrival_hold_duration: 1.0
consecutive_plan_failure_limit: 3
planner_unreachable_attempt_limit: 2
emergency_stop_timeout: 6.0
failure_hold_duration: 2.0
max_recovery_attempts: 0
recovery_target_timeout: 90.0
normal_return:
  maximum_retries: 2
overall_timeout: 1200.0
report_period: 0.1
report_file: /tmp/astra_stage3_low_latest.csv
