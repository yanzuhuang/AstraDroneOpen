# Stage 3: static-obstacle inspection sectors and bounded recovery.
# This is a dry-run configuration. Set enable_control only after preflight and
# point-cloud/TF/occupancy alignment evidence has been reviewed by the owner.
enable_control: false
planning_frame: camera_init

tower:
  name: radio_tower
  frame_id: map
  center: {x: -10.0551, y: 19.7104}
  collision_radius: 6.41

mission:
  # Single source for all inspection-layer heights. The mission node derives
  # inspection_height, inspection_heights and the ascent endpoint from these.
  inspection_top_height: &inspection_top_height 34.0
  layer_offsets: [0.0, -4.0]
  recovery_height_max: 40.0
  virtual_ceil_height: 45.0
  radius: 12.5
  sector_count: 8
  # Production policy is eight sectors.  Staged validation overrides this to
  # one sector in the no-control/integration launch; never use that override
  # as evidence for a complete orbit.
  sector_limit: 8
  # A lap is strictly waypoint 1 -> ... -> waypoint 8 -> waypoint 1.
  inspection_laps: 1
  # One cycle executes top -> lower. Set 2 for the bounded
  # top -> lower -> top -> lower loop validation; layer data is retained.
  planned_cycles: 1
  # Standard waypoint numbering is fixed in the map:
  # 1=0°, 2=45°, ..., 7=270°, 8=315°.
  start_angle_deg: 0.0
  inspection_start_sector: 3
  transition_sector: 3
  direction: counter_clockwise
  minimum_height: 2.0
  maximum_height: 45.0
  minimum_safety_distance: 2.0
  transit_height: 4.0
  observation_radius_offset: 5.0
  observation_angle_deg: -67.5
  approach_segment_length: 6.0
  sector_angle_half_width_deg: 12.0
  # Keep relocations close to the 12.5 m inspection ring and inside the
  # active angular sector. A local blockage may use a 1--3 m temporary
  # descent; the next clear nominal target restores the layer height.
  sector_radius_half_width: 4.0
  sector_height_half_width: 3.0
  maximum_temporary_descent: 3.0
  target_replacement_margin: 2.0

entry_gate:
  # User-facing map sectors are fixed and independent of the inspection-route
  # start angle: 1=+X, 2=NE, 3=+Y, 4=NW, 5=-X, 6=SW, 7=-Y, 8=SE.
  # Internally the node converts this once with entry_sector - 1.
  entry_sector: 7
  preferred_radius: 15.0
  minimum_radius: 15.0
  maximum_radius: 15.0
  angular_sample_step_deg: 7.5
  radial_sample_step: 1.0
  maximum_horizontal_distance: 60.0
  minimum_clearance: 2.0
  cloud_inflation: 0.4
  # FAST-LIO publishes obstacle hits, not a persistent free/unknown voxel
  # state. The instantaneous MID360 field-of-view ratio is therefore a risk
  # diagnostic for sector endpoints, not a hard rejection. Fresh-map,
  # occupancy and known-obstacle checks remain hard constraints.
  unknown_is_hard_constraint: false
  corridor_sample_step: 0.5
  clearance_weight: 0.2
  distance_weight: 0.1
  sector_center_weight: 4.0
  preferred_radius_weight: 4.0
  first_waypoint_weight: 0.8
  blocked_corridor_penalty: 8.0
  maximum_segment_length: 6.0
  # After the fixed vertical climb, use short same-height goals only when the
  # fresh occupancy map proves the entire high corridor clear. Otherwise EGO
  # receives the safe final gate and owns the local detour.
  prefer_safe_overflight: true
  # At the unchanged 0.30 m/s mission speed, the approximately 34 m
  # home-to-gate leg needs at least 113 s before planning detours.
  target_timeout: 180.0
  # Compatibility key; the ascent-specific switch limit below is authoritative.
  maximum_relocations: 28

staging:
  # The captured home-hover XY is immutable. A blocked vertical segment
  # enters bounded HOLD/exit handling and never searches a lateral channel.
  use_configured_xy: false
  x: 0.0
  y: 0.0
  height: 4.0
  climb_height_step: 3.0
  ascent_intermediate_heights: [10.0, 18.0]
  maximum_channel_switches: 0
  minimum_channel_hold: 5.0

layer_transition:
  # Segment both descent and ascent by vertical change. If the two layer
  # start waypoints share XY within tolerance, every segment keeps the upper
  # XY exactly; otherwise XY is interpolated for a smooth diagonal transfer.
  maximum_vertical_step: 2.0
  same_xy_tolerance: 0.25
  target_timeout: 90.0

# The simulated FAST-LIO cloud is hit-only, so missing returns cannot prove a
# free voxel.  These bounds define candidate observability in the MID-360
# sensor volume; known occupancy and EGO planning remain separate hard gates.
coverage:
  angular_bin_deg: 2.0
  neighborhood_radius: 3.0
  sample_resolution: 1.0
  # Match the effective simulated chain: FAST-LIO blind=0.5 m and the
  # Gazebo MID-360 plugin maximum range=40 m.
  minimum_range: 0.5
  maximum_range: 40.0
  unknown_ratio_limit: 0.65
  wait_timeout: 12.0
  safe_altitude_dwell: 4.0
  sensor_min_elevation_deg: -7.2
  sensor_max_elevation_deg: 52.2

candidate:
  # Candidate order does not determine the winner. Hard live-map checks are
  # followed by a weighted score that strongly penalizes radial/sector drift.
  angle_offsets_deg: [0.0, -5.0, 5.0, -10.0, 10.0, -12.0, 12.0]
  radius_offsets_m: [0.0, 2.0, 4.0]
  height_offsets_m: [0.0, -1.0, -2.0, -3.0]
  minimum_clearance: 2.0
  cloud_inflation: 0.4
  corridor_sample_step: 0.5
  blocked_corridor_penalty: 6.0
  score_clearance_weight: 0.2
  score_radius_weight: 6.0
  score_sector_weight: 4.0
  score_height_weight: 14.0
  score_distance_weight: 0.1
  score_continuity_weight: 0.2
  # The crane OBB encloses large empty volumes between sparse mesh members.
  # Keep it as a risk/corridor hint; fresh inflated occupancy remains the hard
  # endpoint authority and the tower radial keep-out remains hard.
  known_obstacle_is_hard_constraint: false

# Conservative known static geometry. These coarse regions only contribute
# risk/corridor hints; fresh inflated occupancy remains the hard authority.
# Gazebo's <state> places tower_crane at (6.36257, 21.7297), yaw=-0.479608.
# Its inch-scaled DAE local bounds are x=[-3.27311,3.27311],
# y=[-27.363674,11.720921], z=[0,35.0282].  The OBB center below is the
# transformed center of those asymmetric local bounds, not the model origin.
static_obstacles:
  names: [tower_crane]
  x: [2.7535]
  y: [14.7908]
  z: [0.0]
  radius: [0.0]
  z_min: [0.0]
  z_max: [35.0283]
  half_extent_x: [3.2732]
  half_extent_y: [19.5424]
  yaw: [-0.479608]

recovery:
  # Recovery is constrained to the current sector and the same 3 m downward
  # envelope as candidate relocation. The legacy configured height remains a
  # global safety ceiling only; runtime recovery derives height from the
  # active inspection layer.
  radial_step: 2.0
  tangent_step: 2.5
  maximum_radius: 16.5
  recovery_height: 38.0
  direction: counter_clockwise

# EGO uses incoming goal z in Stage 3. Keep its required fallback parameter
# tied to the same YAML scalar so it cannot conflict with the first layer.
fsm:
  manual_target_height: *inspection_top_height

topics:
  odom: /Odometry
  command: /planning/pos_cmd
  cloud: /stage3/cloud_registered_filtered
  occupancy_inflate: /grid_map/occupancy_inflate
  planner_status: /planner/status
  bridge_state: /ego_mavros_bridge/state
  mavros_state: /mavros/state
  mavros_extended_state: /mavros/extended_state
  goal: /move_base_simple/goal

outputs:
  state: /tower_mission/state
  current_target: /tower_mission/current_target
  current_sector: /tower_mission/current_sector
  candidate_targets: /tower_mission/candidate_targets
  progress: /tower_mission/progress
  face_tower: /tower_mission/face_tower
  selected_tower_center: /tower_mission/selected_tower_center

services:
  tracking: /ego_mavros_bridge/enable_tracking
  cancel: /ego_mavros_bridge/cancel_current_trajectory
  resume: /ego_mavros_bridge/resume_ego
  return_home: /ego_mavros_bridge/return_home
  land: /ego_mavros_bridge/land

input_timeout: 0.7
# /mavros/state is event-driven with a nominal 1 Hz refresh. Keep this
# independent from the high-rate odometry/planner freshness deadline.
entry_fcu_state_timeout: 2.0
map_timeout: 0.7
planning_timeout: 10.0
goal_timeout: 180.0
# EGO return and PX4 AUTO.LAND are separate phases. The landing deadline starts
# when the bridge reports LANDING; it must not inherit time already spent on
# the long EGO return trajectory.
return_timeout: 300.0
landing_timeout: 90.0
return_egress:
  # Failure fallback only. Normal completion reaches the final layer's
  # EXIT_GATE and then lets EGO plan directly to the bridge's 4 m home hover,
  # avoiding a task-commanded climb to this conservative fallback height.
  orbit_radius: 24.0
  transit_height: 38.0
  maximum_angle_step_deg: 30.0
  obstacle_inflation: 2.0
  corridor_sample_step: 0.5
  minimum_goal_separation: 0.5
  target_timeout: 90.0
  # Finite retries tolerate isolated FCU/time-sync or estimator spikes during
  # the long multi-segment egress; exhaustion still forces a safe landing.
  maximum_retries: 4
  home_xy_tolerance: 1.5
arrival_tolerance: 0.5
arrival_velocity_threshold: 0.2
arrival_yaw_tolerance: 0.26
arrival_hold_duration: 1.0
consecutive_plan_failure_limit: 3
# A safe endpoint is retried unchanged through EGO before it may be marked
# planner_unreachable and replaced. A blocked straight chord is only a risk.
planner_unreachable_attempt_limit: 2
emergency_stop_timeout: 6.0
failure_hold_duration: 2.0
max_recovery_attempts: 2
# R1/R2 may climb 16 m at the unchanged 0.30 m/s speed before descending back
# to the locked sector; keep the retry finite but physically achievable.
recovery_target_timeout: 180.0
normal_return:
  # Failure recovery only. Normal completion never replays the 26 m ingress.
  maximum_retries: 2
overall_timeout: 2400.0
report_period: 0.2
report_file: /tmp/astra_stage3_latest.csv
