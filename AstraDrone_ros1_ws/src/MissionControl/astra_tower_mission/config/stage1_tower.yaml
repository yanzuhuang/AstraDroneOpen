# Stage 1 only: fixed-height waypoint flight without EGO or obstacle avoidance.
# Coordinates are absolute in the MAVROS local ENU `map` frame. The simulation
# launch spawns at world (0, 0); the preflight origin check rejects a mismatch.

tower:
  name: radio_tower_0
  frame_id: map
  center:
    x: 24.4614
    y: 39.3288
  # Conservative radial mesh envelope measured near the 4 m flight slice.
  collision_radius: 6.41

mission:
  radius: 10.0
  height: 8.0
  waypoint_count: 8
  # Start south of the tower to keep the direct ingress from home away from
  # the closest forest obstacles.
  start_angle_deg: -90.0
  direction: counter_clockwise
  # Camera optical-axis yaw relative to body +X. Body yaw = tower bearing - offset.
  camera_yaw_offset_deg: 0.0
  maximum_speed: 0.30
  maximum_acceleration: 0.50
  maximum_yaw_rate_deg_s: 30.0
  position_tolerance: 0.40
  yaw_tolerance_deg: 12.0
  waypoint_hold_time: 2.0
  waypoint_timeout: 240.0
  mission_timeout: 600.0
  overall_timeout: 1200.0
  minimum_height: 2.0
  maximum_height: 10.0
  minimum_safety_distance: 2.0
  maximum_home_distance: 60.0

flight:
  takeoff_height: 8.0
  takeoff_tolerance: 0.25
  takeoff_hold_time: 1.0
  takeoff_timeout: 60.0
  initial_hover_duration: 3.0
  initial_hover_timeout: 30.0
  return_height: 8.0
  return_hold_time: 2.0
  return_timeout: 240.0
  preland_hover_duration: 3.0
  preland_hover_timeout: 30.0

landing:
  # Normal descent stays in OFFBOARD. This is not PX4 MPC_LAND_SPEED.
  cruise_speed: 0.40
  touchdown_speed: 0.20
  slowdown_height: 1.20
  flare_height: 0.30
  contact_height: 0.12
  contact_velocity_max: 0.10
  contact_confirm_time: 0.20
  contact_descent_speed: 0.30
  ground_confirm_time: 0.80
  timeout: 90.0
  disarm_retry_interval: 1.0
  disarm_timeout: 15.0

safety:
  loop_rate: 20.0
  prestream_duration: 3.0
  preflight_timeout: 120.0
  input_timeout: 2.0
  service_retry_interval: 2.0
  arm_offboard_timeout: 30.0
  authority_check_interval: 1.0
  mode_recovery_timeout: 5.0
  expected_home_x: 0.0
  expected_home_y: 0.0
  home_origin_tolerance: 2.0

record:
  maximum_actual_path_points: 25000
  report_period: 0.20
  report_file: /tmp/astra_stage1_latest.csv

topics:
  mavros_state: /mavros/state
  mavros_extended_state: /mavros/extended_state
  mavros_pose: /mavros/local_position/pose
  mavros_velocity: /mavros/local_position/velocity_local
  setpoint_position: /mavros/setpoint_position/local
  setpoint_raw_local: /mavros/setpoint_raw/local
  monitored_control:
    - /mavros/setpoint_position/local
    - /mavros/setpoint_position/global
    - /mavros/setpoint_position/global_to_local
    - /mavros/setpoint_raw/local
    - /mavros/setpoint_velocity/cmd_vel
    - /mavros/setpoint_velocity/cmd_vel_unstamped
    - /mavros/setpoint_attitude/attitude
    - /mavros/setpoint_attitude/cmd_vel
    - /mavros/setpoint_raw/attitude
    - /mavros/setpoint_attitude/thrust

services:
  arming: /mavros/cmd/arming
  set_mode: /mavros/set_mode

# These are private to the tower_mission node and can still be remapped.
outputs:
  route_preview: route_preview
  waypoint_poses: waypoint_poses
  markers: route_markers
  current_target: current_target
  actual_path: actual_path
  state: state
  progress: progress
  waypoint_index: waypoint_index
  position_error: position_error
  yaw_error: yaw_error_deg
  hold_time: hold_time
  final_result: final_result
  report_file: report_file
