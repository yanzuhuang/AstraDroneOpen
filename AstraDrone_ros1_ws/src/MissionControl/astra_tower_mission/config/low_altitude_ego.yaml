# Planner-only low-altitude overrides.  Keep mission topics, frames and
# coordination parameters out of the EGO private namespace: loading the full
# task YAML there can overwrite the migrated planner's namespaced interfaces.
grid_map:
  local_update_range_x: 10.0
  local_update_range_y: 10.0
  local_update_range_z: 4.5
  max_ray_length: 10.0

optimization:
  lambda_smooth: 1.0
  lambda_collision: 2
  lambda_feasibility: 0.1
  lambda_fitness: 2.0
  dist0: 0.8
