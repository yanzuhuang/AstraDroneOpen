# AstraDroneOpen first formal 10k SAC training configuration v1.
# CleanRL-derived values are reference defaults/structure, not Learning Speed
# paper parameters. Runtime-verified means verified by the 2026-08-23 SAC
# training-loop qualification unless a more specific source is stated.
sac:
  observation_dim: 3267
  action_dim: 1
  hidden_dim: 256
  gamma: 0.99
  tau: 0.005
  batch_size: 64
  # 2026-08-23 exploration-stability fix: 0.0003 caused a one-update actor
  # mean collapse on the real 3267-D replay even after critic warm-up.  1e-5
  # preserved finite learning without tanh boundary saturation in offline
  # replay.  AstraDroneOpen calibrated; not a Learning Speed paper value.
  policy_learning_rate: 0.00001
  critic_learning_rate: 0.001
  alpha_learning_rate: 0.001
  policy_frequency: 2
  # The failed 10k pilot and qualification02 both showed extreme actor output
  # while the randomly initialized critics were still oscillating.  Hold only
  # actor/alpha updates for the first 100 learner updates; critics and target
  # critics continue updating, and environment interaction remains stochastic.
  # This is an AstraDroneOpen startup guard, not a Learning Speed paper value.
  critic_warmup_updates: 100
  target_network_frequency: 1
  # 2026-08-23 action-exploration stability fix.  The 10k pilot used [-5, 2]
  # and showed log_std -5 -> -0.051 on a preserved real Observation while
  # alpha accumulated 0.2 -> about 1.6; stochastic actions then reached both
  # bounds and triggered repeated negative-delta replans.  [-3, -1] keeps the
  # target entropy inside a trainable interval while bounding per-state Normal
  # std to exp(-3)..exp(-1).  This is AstraDroneOpen calibrated, not paper data.
  log_std_min: -3.0
  log_std_max: -1.0
  automatic_entropy_tuning: true
  initial_alpha: 0.2
  target_entropy: -1.0
  device: cpu
  torch_num_threads: 1
  seed: 1
  learner_side_normalization: false
  updates_per_second: 5.0

replay:
  capacity: 100000
  initial_allocation: 4096
  intervention_tolerance_mps: 0.005

action:
  expected_v_max_min: 0.05
  expected_v_max_max: 0.40

episode:
  policy_period_sec: 0.1
  # This is a per-Episode ceiling, not the formal training stop condition.
  # Genuine early terminals close/reset normally and training continues with
  # later Episodes until the cumulative valid-transition target is exact.
  max_steps: 500
  max_duration_sec: 80.0
  start_timeout_sec: 30.0
  completion_timeout_sec: 30.0
  deadline_tolerance_sec: 0.02
  maximum_in_flight: 16
  minimum_active_speed_mps: 0.05

step:
  duration_sec: 0.1
  action_timeout_sec: 3.0
  applied_timeout_sec: 4.0
  hold_timeout_sec: 30.0
  next_observation_timeout_sec: 5.0
  requested_match_tolerance_mps: 1.0e-6
  applied_pair_tolerance_mps: 0.005

tracking_safety:
  limit_m: 1.0
  duration_sec: 1.0

training:
  mode: training
  target_valid_transitions: 10000
  learning_starts: 1000
  warmup_action_sampling: deterministic_actor_mean
  checkpoint_steps: [5000, 10000]
  checkpoint_interval: 5000
  evaluation_during_training: false
  completion_reason: training_target_reached

environment:
  # The launch overrides this to false for qualification/evaluation. The
  # runner fails closed if training is not randomized or evaluation is.
  reset_randomization_enabled: true

evaluation:
  checkpoint_path: ""
  checkpoint_step: 0
  deterministic_actor: true
  write_training_replay: false
  network_updates: false

numerical_safety:
  # Fail-closed thresholds are deliberately far outside the smoke envelope
  # (Q about [-55, 13], critic gradient max about 5.95e3). They detect clear
  # numerical runaway without treating normal SAC variance as divergence.
  q_abs_limit: 1000.0
  q_consecutive_limit: 5
  gradient_abs_limit: 100000.0
  loss_abs_limit: 100000000.0

qualification:
  episode_count: 20
  phase_a_min_transitions: 1000
  phase_a_deterministic_actor: true
  phase_b_min_updates: 100
  phase_b_update_timeout_wall: 90.0
  # Qualification-only fail-closed gates.  They do not shape actions.
  stochastic_min_transitions: 500
  stochastic_action_std_max: 0.45
  stochastic_boundary_fraction_max: 0.01
  stochastic_force_replan_delta_max: 0

parameter_provenance:
  observation_action_dimensions:
