episode:
  policy_period_sec: 0.1
  max_steps: 100
  start_timeout_sec: 600.0
  completion_timeout_sec: 30.0
  deadline_tolerance_sec: 0.02
  minimum_active_speed_mps: 0.20

step:
  action_timeout_sec: 3.0
  applied_timeout_sec: 4.0
  next_observation_timeout_sec: 5.0
  requested_match_tolerance_mps: 1.0e-6
  applied_pair_tolerance_mps: 0.005

validation:
  action_sequence_mps:
    [0.50, 0.50, 0.50, 0.50, 0.50,
     0.70, 0.70, 0.70, 0.70, 0.70,
     1.00, 1.00, 1.00, 1.00, 1.00,
     1.40, 1.40, 1.40, 1.40, 1.40,
     1.00, 1.00, 1.00, 1.00, 1.00,
     1.60, 1.60, 1.60, 1.60, 1.60,
     1.30, 1.30, 1.30, 1.30, 1.30,
     1.80, 1.80, 1.80, 1.80, 1.80,
     1.20, 1.20, 1.20, 1.20, 1.20,
     1.80, 1.80, 1.80, 1.80, 1.80]
