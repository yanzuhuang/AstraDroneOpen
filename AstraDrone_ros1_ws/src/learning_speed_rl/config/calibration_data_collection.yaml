# Read-only mirror for classifying the existing bridge safety terminal.  These
# values must stay equal to ego_gazebo_bridge's reviewed gate; this collector
# does not publish them back to the bridge.
tracking_safety:
  limit_m: 1.0
  duration_sec: 1.0

clearance_sampling_rate_hz: 2.0
applied_pair_tolerance_mps: 0.005

topics:
  observation_c: learning_speed/observation_c
  official_trajectory: planning/bspline
  action_stamped: learning_speed/action_stamped
  applied_v_max: learning_speed/applied_v_max
  planner_status: planner/status
  mission_state: tower_mission/state
  mission_success: tower_mission/mission_success
  mission_failure: tower_mission/mission_failure
  mission_done: tower_mission/mission_done
  bridge_state: ego_mavros_bridge/state
  bridge_tracking_error: ego_mavros_bridge/tracking_error
  odom: Odometry
  raw_filtered_cloud: stage3/cloud_registered_filtered
  inflated_occupancy: stage3/occupancy_inflate
