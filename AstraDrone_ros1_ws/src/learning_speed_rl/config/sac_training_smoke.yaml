# Algorithm structure and defaults are adapted from the reviewed CleanRL
# sac_continuous_action.py. Values marked AstraDroneOpen are project settings,
# not Learning Speed paper parameters.
sac:
  observation_dim: 3267
  action_dim: 1
  hidden_dim: 256
  gamma: 0.99
  tau: 0.005
  batch_size: 64
  policy_learning_rate: 0.0003
  critic_learning_rate: 0.001
  alpha_learning_rate: 0.001
  policy_frequency: 2
  target_network_frequency: 1
  log_std_min: -5.0
  log_std_max: 2.0
  automatic_entropy_tuning: true
  initial_alpha: 0.2
  target_entropy: -1.0
  device: cpu
  torch_num_threads: 1
  seed: 1
  learner_side_normalization: false
  updates_per_second: 5.0

replay:
  capacity: 5000
  intervention_tolerance_mps: 0.005

action:
  # Lower bound: existing speed_adapter.yaml safety/v_max_min.
  # Upper bound: current worksite training launch static/dynamic maximum.
  expected_v_max_min: 0.05
  expected_v_max_max: 0.40

episode:
  policy_period_sec: 0.1
  max_steps: 0
  max_duration_sec: 80.0
  start_timeout_sec: 30.0
  completion_timeout_sec: 30.0
  deadline_tolerance_sec: 0.02
  maximum_in_flight: 16
  minimum_active_speed_mps: 0.05

step:
  duration_sec: 0.1
  action_timeout_sec: 3.0
  applied_timeout_sec: 4.0
  hold_timeout_sec: 30.0
  next_observation_timeout_sec: 5.0
  requested_match_tolerance_mps: 1.0e-6
  applied_pair_tolerance_mps: 0.005

tracking_safety:
  limit_m: 1.0
  duration_sec: 1.0

qualification:
  episode_count: 5
  phase_a_min_transitions: 1000
  phase_a_deterministic_actor: true
  phase_b_min_updates: 100
  phase_b_update_timeout_wall: 90.0

provenance:
  network_and_algorithm: CleanRL reference structure
  gamma_tau_learning_rates_log_std: CleanRL reference defaults
  batch_size_update_rate_device: AstraDroneOpen explicit smoke settings
  phase_a_deterministic_actor: AstraDroneOpen causal collection setting
  observation_normalization: disabled AstraDroneOpen smoke setting
  action_bounds: existing AstraDroneOpen worksite SpeedSafetyFilter profile
