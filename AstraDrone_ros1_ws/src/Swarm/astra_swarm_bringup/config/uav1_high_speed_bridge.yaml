# UAV1 bridge envelope for the isolated fixed-speed high-speed qualification.
# EGO constrains each XYZ component independently.  The bridge constrains the
# 3-D vector norm, so sqrt(3) headroom plus EGO's 1e-4 feasibility epsilon
# prevents a second, hidden clamp after EGO accepts max_vel=4.0 m/s and
# max_acc=3.0 m/s^2.  The qualification launch sets feasibility tolerance=0.
enable_control: false
require_sim_time: true
require_start_permission: true
start_permission_topic: /uav1/swarm/takeoff_permission
auto_track_on_command: false
takeoff_height: 4.0
return_height: 4.0
min_relative_height: 0.3
max_relative_height: 40.0
max_horizontal_radius: 60.0
cloud_timeout: 0.7
mavros_pose_timeout: 1.5
planner_odom_timeout: 0.7
command_timeout: 0.60
fcu_state_timeout: 2.0
extended_state_timeout: 2.0
land_after_loss: 8.0
alignment_position_tolerance: 0.75
alignment_yaw_error_duration: 1.0
virtual_ceil_height: 45.0
planning_frame: uav1/camera_init
mavros_frame: uav1/map
command_topic: /uav1/planning/pos_cmd
planner_odom_topic: /uav1/Odometry
cloud_topic: /uav1/stage3/cloud_registered_filtered
mavros_state_topic: /uav1/mavros/state
mavros_extended_state_topic: /uav1/mavros/extended_state
mavros_pose_topic: /uav1/mavros/local_position/pose_framed
input_goal_topic: /uav1/move_base_simple/goal
planner_goal_topic: /uav1/planning/goal
setpoint_topic: /uav1/mavros/setpoint_raw/local
arming_service: /uav1/mavros/cmd/arming
set_mode_service: /uav1/mavros/set_mode
planning_cancel_topic: /uav1/planning/cancel
tower_yaw_override_enabled: true
tower_camera_yaw_offset: 0.0
forward_yaw_min_speed: 0.05
tower_center_topic: /uav1/tower_mission/selected_tower_center
tower_yaw_mode_topic: /uav1/tower_mission/face_tower
max_yaw_rate: 0.5235987755982988
max_velocity: 6.928376435356265
max_acceleration: 5.196325627787389
control_topics:
  position: [/uav1/mavros/setpoint_position/local, /uav1/mavros/setpoint_position/global, /uav1/mavros/setpoint_position/global_to_local]
  raw_local: [/uav1/mavros/setpoint_raw/local]
  velocity: [/uav1/mavros/setpoint_velocity/cmd_vel, /uav1/mavros/setpoint_velocity/cmd_vel_unstamped]
  attitude: [/uav1/mavros/setpoint_attitude/attitude, /uav1/mavros/setpoint_attitude/cmd_vel, /uav1/mavros/setpoint_raw/attitude]
  thrust: [/uav1/mavros/setpoint_attitude/thrust]
